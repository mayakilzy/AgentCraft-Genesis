# AgentCraft Genesis — Upstream Capability Census (machine-readable inventory)
#
# Derived from the Founding Architecture v0.1 (REISSUED) and re-verified 2026-10-05:
#   - all source_url links returned HTTP 200 on 2026-10-05
#   - upstream release state verified via GitHub API on 2026-10-05
#
# This is an INVENTORY of treasures, not a vendor dump: no upstream code enters Genesis.
# Deferred entries are preserved knowledge, not MVP requirements.
#
# Field reference:
#   id               unique census key "<source>.<capability>"
#   capability       human-readable capability name
#   source           upstream project providing it
#   source_url       canonical verification link
#   status           shipped | template | roadmap | experimental
#                    (template = capability of an alpha/template upstream, not a stable package)
#   genesis_decision REUSE | REUSE_PATTERN | ADAPT | DEFER | DROP_DUPLICATE | EXTEND
#   canonical_owner  the one system that canonically owns this capability for Genesis
#   notes            engineering context
#   future_value     high | medium | low — value if/when activated later

census:
